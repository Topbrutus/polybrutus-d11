name: Verify Polybrutus D11 exact certificate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible exact mathematics dependency
        run: python -m pip install sympy==1.14.0
      - name: Exact D11 labelled metric, rank and graph spectrum
        run: python src/verify_d11.py
      - name: Independent rational 120-pair and spectral verification
        run: python tests/independent_d11.py
